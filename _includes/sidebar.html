<article class="container">
  <div class="row my-3" id="posts">
    <div class="col-md-12">
      <h4 class="h4 mb-3">Últimos posts en el Blog</h4>
    </div>
    <div class="col-md-12">
      <ul class="list-group">
        {% for post in site.posts %}
        <li class="list-group-item">
          <a href="{{ post.url }}">{{ post.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
  {% include publicacionesRecientes.html %}
  <div class="row" id="links">
    <div class="col-md-12">
      <h4 class="h4">Enlaces</h4>
    </div>
    <div class="col-md-12">
      <ul class="list-group" itemscope itemtype="http://schema.org/Person">
        {% for link in site.data.mis_enlaces.enlaces %}
        <li class="d-inline-block m-1" itemprop="sameAs">
          <a itemprop="sameAs" href="{{ link.url }}" target="_blank" rel="noopener" class="">
            <i class="fa-web fa-lg"></i>
            <span class="">{{ link.name }}</span>
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
      {% include ads/anuncio-grafico.html %}
  </div>
</article>
