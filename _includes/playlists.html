	{% if page.playlistSpotify or page.playlistSAmazonMusicSRC %}
		<div class="col-md-12">
			<div class="row my-3">
				<div class="col-12"><h2>Escucha una playlist inspirada en el libro</h2></div>
				{% if page.playlistSAmazonMusicSRC %}
					<div class="col" id="playlistAmazon">
						<iframe id='{{ page.playlistSAmazonMusicID }}' src='{{ page.playlistSAmazonMusicSRC }}' width='100%' height='352px' frameBorder='0' style='border-radius:20px;max-width:'></iframe>
					</div>
				{% endif %}
				{% if page.playlistSpotify %}
					<div class="col" id="playListSpotify">
						<iframe style="border-radius:12px" src="{{ page.playlistSpotify }}" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
					</div>
				{% endif %}
			</div>
		</div>
	{% endif %}
