<footer class="py-4 border-top shadow mt-auto bg-dark gradiente-1">
 
  <div class="container text-center">
    <ul class="bd-footer-links" itemscope itemtype="http://schema.org/Person">
      {% for redSocial in site.data.redes_sociales.redesSociales %} {% if redSocial.redUsername %}
      <li class="d-inline-block m-1">
        <a itemprop="sameAs" href="https://{{ redSocial.redUrl }}/{{ redSocial.redUsername }}" target="_blank"
          rel="noopener" class="text-info glow-data">
          <i class="{{ redSocial.redIcon }} fa-lg"></i>
          <span class="d-none">{{ redSocial.redUsername }}</span>
        </a>
      </li>
      {% endif %} {% endfor %} {% if site.rss %}
      <li class="d-inline-block m-1">
        <a href="{{ 'feed.xml' | relative_url }}" class="text-info">
          <i class="fas fa-rss fa-lg"></i>
        </a>
      </li>
      {% endif %}
    </ul>
    <p class="m-0 lh-1">&copy; {{ site.time | date: '%Y' }} {{site.title}}. Todos los derechos reservados.</p>
    <p class="m-0 lh-1"><small class="source-code fw-lighter fs-9 text-muted glow-data">-> http://127.0.0.1:4000/ <span id="date-display"></span> |</small></p>

    <script>
      const DateTime = luxon.DateTime;
      const dateDiv = document.getElementById('date-display');
    
      function updateDateTime() {
        const now = DateTime.now();
        
        // Extraer la parte de la fecha y hora sin la zona horaria
        let dateTimeString = now.toLocaleString(DateTime.DATETIME_HUGE_WITH_SECONDS);
        
        // Extraer la zona horaria separando por "(" y tomamos la última parte
        let timezone = dateTimeString.includes("(") ? dateTimeString.split("(").pop() : "";
        
        // Construimos el nuevo formato correctamente ordenado
        dateDiv.textContent = dateTimeString.split(" (")[0] + 
                              `.${now.toFormat('SSS')} ms` + 
                              (timezone ? ` (${timezone}` : "");
      }
    
      setInterval(updateDateTime, 1); // Actualiza en tiempo real
      updateDateTime();
    </script>
       
  </div>
</footer>
<script>
  // Función para convertir texto a binario
  function textToBinary(text) {
    return text
      .split('')
      .map(char => char.charCodeAt(0).toString(2).padStart(8, '0'))
      .join(' ');
  }

  // Obtener el texto del elemento con id "content"
  document.addEventListener('DOMContentLoaded', () => {
    const contentElement = document.getElementById('content');
    const binaryOutputElement = document.getElementById('binary-output');

    if (contentElement && binaryOutputElement) {
      const contentText = contentElement.innerText || contentElement.textContent;
      const binaryText = textToBinary(contentText);

      // Mostrar el texto en binario en el div con id "binary-output"
      binaryOutputElement.textContent = binaryText;
    }
  });
</script>
<script>
  // Función para convertir texto a binario
  function textToBinary(text) {
    return text
      .split('')
      .map(char => char.charCodeAt(0).toString(2).padStart(8, '0'))
      .join(' ');
  }

  // Obtener el texto del elemento con id "content"
  document.addEventListener('DOMContentLoaded', () => {
    const contentElement = document.getElementById('content');

    if (contentElement) {
      const contentText = contentElement.innerText || contentElement.textContent;
      const binaryText = textToBinary(contentText);

      // Establecer el texto binario como contenido de body::before
      const styleElement = document.createElement('style');
      styleElement.textContent = `
        body::before {
          content: "${binaryText.replace(/"/g, '\\"')}";
          white-space: pre-wrap;
          font-family: monospace;
          font-size: 0.75rem;
          color: rgba(0,0,0,0.1);
          filter: blur(1px);
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          overflow: auto;
          z-index: -1;
        }
      `;
      document.head.appendChild(styleElement);
    }
  });
</script>
