# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: I. A. Galdames
subtitle: Escritor chileno de ciencia ficción
author: I.A. Galdames
email: caminantestelar@gmail.com
description: >-
  I.A. Galdames es un escritor chileno de ciencia ficción y cyberpunk.
  Autor de Corceles Azules y Corceles Rojos, publica cuentos, ensayos y
  artículos sobre literatura especulativa, escritura creativa y tecnología.
  También es desarrollador web e ingeniero de sistemas.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://ignaciogaldames.com" # the base hostname & protocol for your site, e.g. http://example.com

twitter_username: IAGaldames
github_username: ignaciogaldames

# GEO & Language
lang: es-CL
timezone: America/Santiago
country: Chile
city: Santiago
author_name: I.A. Galdames
author_full_name: Ignacio Andrés Galdames
author_nationality: Chilean
author_birth_year: 1987

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - node_modules
  - webpack.config.js
  - package.json
  - package-lock.json
  # - assets/js
  - assets/scss

include:
  - assets/js/bundle.js
  - assets/js/main.js
  - assets/css/main.min.css

css_path: "/assets/css/main.min.css" # CSS para producción
author_image_path: "/assets/img/iagaldames_2024.jpg"

collections:
  libros:
    output: true
  cuentos:
    output: true
    
kramdown:
  syntax_highlighter_opts:
    disable: true
    
sass:
  quiet_deps: true