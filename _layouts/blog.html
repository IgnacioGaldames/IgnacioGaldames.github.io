---
layout: default
---

<div class="article" id="page">
  <div class="row">
    <article class="col-12" id="article">
      <div class="row">
        <div class="col-12">
          <h1 id="page-title">{{ page.title }}</h1>
        </div>
        <div class="col-12 content">
          <ul>
            {% for post in site.posts %}
            <li>
              <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
              {{ post.excerpt }}
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </article>
  </div>
</section>
