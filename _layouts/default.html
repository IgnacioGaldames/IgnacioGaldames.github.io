<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
{% include head.html %}
<script>
	var binaryStatus = true;
</script>

<body class="default d-flex flex-column min-vh-100">
	<div class="crt-overlay"></div>
	{% include header.html %}
	<main class="">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12 col-md-2 col-xxl-1 order-1 order-md-0 d-none d-md-block">
					<aside>
					</aside>
				</div>
				<div class="col-12 col-md-10 col-xxl-11 order-0 order-md-1">
					{% if page.image %}
					<div class="container-fluid d-flex align-items-center text-white text-shadow"
						style="background-image: url(/assets/img/{{ page.image}}); background-position: center center; background-repeat:no-repeat; background-size:cover; no-repeat; min-height: 200px">
						{% endif %}
						<div class="container">
							<div class="row my-3">
								<div class="col-12 text-center glow-data" id="title">
									{% if page.title %}
									<h1 class="display-3 text-capitalize" id="page-title">{{ page.title}}</h1>
									{% else %}
									<h1 class="display-3 text-capitalize" id="site-title">{{ site.title}}</h1>
									{% endif %}
								</div>
								{% if page.subtitle %}
								<div class="col-12 text-center" id="subtitle">
									<h2 class="h3" id="page-subtitle">{{ page.subtitle}}</h2>
								</div>
								{% endif %}
							</div>
						</div>
						{% if page.image %}
					</div>
					{% endif %}
					<section class="container" id="content">
						{{ content }}
					</div>
				</div>
			</div>
		</div>

	</main>

	{% include footer.html %}

	<script src="{{ '/assets/js/bundle.js' | relative_url }}"></script>
	<script>
		document.addEventListener("DOMContentLoaded", () => {
			const targetElements = document.querySelectorAll('h1');
			targetElements.forEach(el => {
				const walker = document.createTreeWalker(
					el,
					NodeFilter.SHOW_TEXT,
					{
						acceptNode: function (node) {
							if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
							return NodeFilter.FILTER_ACCEPT;
						}
					}
				);

				const nodes = [];
				while (walker.nextNode()) {
					nodes.push(walker.currentNode);
				}

				nodes.forEach(node => {
					const text = node.nodeValue;
					if (!/[io01]/i.test(text)) return;

					// Reemplazo seguro: una sola pasada, sin solapamientos
					const replacedHTML = text.replace(/io|oi|10|01|i|o|1|0/gi, match => {
						if (/^(io|oi|10|01)$/i.test(match)) {
							return `<span class="io io-highlight">${match}</span>`;
						} else if (/^(i|1)$/i.test(match)) {
							return `<span class="io">${match}</span>`;
						} else if (/^(o|0)$/i.test(match)) {
							return `<span class="io">${match}</span>`;
						}
						return match;
					});

					if (replacedHTML !== text) {
						const wrapper = document.createElement("span");
						wrapper.innerHTML = replacedHTML;
						node.parentNode.replaceChild(wrapper, node);
					}
				});
			});
		});
	</script>

</body>
</html>
