<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
{% include head.html %}
<script>
	var binaryStatus = true;
</script>

<body class="default d-flex flex-column min-vh-100">
	{% include header.html %}
	<main class=" my-5">
		<div class="container-fluid">
			<div class="row">
				<div class="col-12 col-md-2 col-xxl-1 order-1 order-md-0 d-none d-md-block">
					<aside>
						<small>
							<div class="source-code fw-lighter text-muted glow-data text-center" id="binary-output"
								style="font-size: 0.23rem;"></div>
						</small>
					</aside>
				</div>
				<div class="col-12 col-md-10 col-xxl-11 order-0 order-md-1">
					{% if page.image %}
					<div class="container-fluid d-flex align-items-center text-white text-shadow"
						style="background-image: url(/assets/img/{{ page.image}}); background-position: center center; background-repeat:no-repeat; background-size:cover; no-repeat; min-height: 200px">
						{% endif %}
						<div class="container">
							<div class="row my-3">
								<div class="col-12 text-center glow-data" id="title">
									{% if page.title %}
									<h1 class="display-1 text-capitalize" id="page-title">{{ page.title}}</h1>
									{% else %}
									<h1 class="display-1 text-capitalize" id="site-title">{{ site.title}}</h1>
									{% endif %}
								</div>
								{% if page.subtitle %}
								<div class="col-12 text-center mb-3" id="subtitle">
									<h2 class="h2" id="page-subtitle">{{ page.subtitle}}</h2>
								</div>
								{% endif %}
							</div>
						</div>
						{% if page.image %}
					</div>
					{% endif %}
					<div id="content">
						{{ content }}
					</div>
				</div>
			</div>
		</div>

	</main>

	{% include footer.html %}

	<script src="{{ '/assets/js/bundle.js' | relative_url }}"></script>
</body>

</html>
